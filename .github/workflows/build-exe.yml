name: Build Windows EXE

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Download FFmpeg (ffmpeg.exe + ffprobe.exe)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_extracted
          $ffmpegExe = Get-ChildItem -Path ffmpeg_extracted -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobeExe = Get-ChildItem -Path ffmpeg_extracted -Recurse -Filter ffprobe.exe | Select-Object -First 1
          Copy-Item $ffmpegExe.FullName -Destination .
          Copy-Item $ffprobeExe.FullName -Destination .

      - name: Build single-file EXE (bundles ffmpeg + ffprobe inside)
        run: >
          pyinstaller --onefile --windowed --name compress_video
          --add-binary "ffmpeg.exe;."
          --add-binary "ffprobe.exe;."
          compress_video.py

      - name: Upload built EXE
        uses: actions/upload-artifact@v4
        with:
          name: compress_video-windows
          path: dist/compress_video.exe
